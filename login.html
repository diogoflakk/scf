<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA GCF - LOGIN</title>

    <link rel="icon" type="image/png" href="logo.png">
    
    <link rel="stylesheet" href="theme.css">
    
    <script src="theme.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-box { background: var(--bg-surface); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 450px; text-align: center; }
        .select-user { width: 100%; font-size: 16px; padding: 15px; border-radius: 8px; background: var(--input-bg); color: var(--input-text); border: 1px solid var(--border-color); font-weight: 500; box-sizing: border-box; margin-bottom: 20px; }
        .select-user:focus { border-color: var(--accent-main); outline: none; }
        .pin-input { width: 100%; font-size: 36px; text-align: center; letter-spacing: 15px; margin-bottom: 20px; padding: 15px; border-radius: 8px; background: var(--input-bg); color: var(--accent-main); border: 1px solid var(--border-color); box-sizing: border-box; transition: 0.3s; }
        .pin-input:focus { border-color: var(--accent-main); outline: none; }
        button { width: 100%; background: var(--accent-main); color: #FFF; border: none; padding: 16px; font-size: 16px; font-weight: 700; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        button:hover { filter: brightness(1.1); }
        button.btn-success { background: var(--accent-success); color: #FFF; font-weight: 800; }
        .btn-reset { background: transparent; color: var(--text-muted); border: none; font-size: 13px; margin-top: 15px; cursor: pointer; text-decoration: underline; width: auto; padding: 5px; }
        .btn-reset:hover { color: var(--text-main); }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); font-size: 14px; text-transform: uppercase; }
    </style>
</head>
<body>

    <button class="theme-float-btn" onclick="alternarTema()" title="Cambiar Tema">🌓</button>

    <div class="login-box">
        <div style="margin-bottom: 15px;">
            <img src="logo.png" alt="Logo GCF" style="height: 48px; width: auto; object-fit: contain;">
        </div>

        <h1 style="color: var(--text-main); margin-top: 0; font-size: 24px;">SISTEMA GCF</h1>
        <p style="color: var(--text-muted); margin-bottom: 25px;">Seleccione su usuario e ingrese su PIN</p>
        
        <div class="form-group">
            <label>Seleccionar Operador:</label>
            <select id="select_usuario" class="select-user" onchange="cambiarUsuarioSeleccionado()">
                <option value="">-- Cargando operadores --</option>
            </select>
        </div>

        <div id="seccion_pin" style="display:none;">
            <p id="pin_message" style="color: var(--text-main); font-weight: 600; font-size: 15px; margin-bottom: 10px;">PIN:</p>
            <input type="password" id="pin_input" class="pin-input" maxlength="20" placeholder="****" inputmode="numeric" onkeyup="checkEnter(event)">
            <button id="btn_login" onclick="procesarLogin()">INICIAR SESIÓN</button>
            <button class="btn-reset" onclick="solicitarRestablecimientoPIN()">🔑 ¿Olvidaste tu PIN? Restablecer</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://yopvikmrjnqcbkkubcbs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_XQ5WAm8porUCSyP_q37sPQ_Ubxlr0Rl";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let listaUsuariosCache = [];
        let usuarioEnProceso = null;

        window.onload = async () => {
            await cargarOperadoresEnSelect();
        };

        async function cargarOperadoresEnSelect() {
            const { data: usuarios, error } = await supabaseClient.from('usuarios').select('*').order('nombre', { ascending: true });
            const select = document.getElementById('select_usuario');
            
            if (error || !usuarios) {
                select.innerHTML = '<option value="">⚠️ Error al cargar usuarios</option>';
                return;
            }

            listaUsuariosCache = usuarios;
            select.innerHTML = '<option value="">-- Seleccione su nombre --</option>';
            
            usuarios.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.dni;
                opt.innerText = `${u.nombre} (${u.rol || 'Operador'})`;
                select.appendChild(opt);
            });
        }

        function cambiarUsuarioSeleccionado() {
            const dniSeleccionado = document.getElementById('select_usuario').value;
            const seccionPin = document.getElementById('seccion_pin');
            const msg = document.getElementById('pin_message');
            const btn = document.getElementById('btn_login');
            const inputPin = document.getElementById('pin_input');

            if (!dniSeleccionado) {
                seccionPin.style.display = 'none';
                usuarioEnProceso = null;
                return;
            }

            usuarioEnProceso = listaUsuariosCache.find(u => u.dni === dniSeleccionado);
            if (usuarioEnProceso) {
                seccionPin.style.display = 'block';
                inputPin.value = '';
                inputPin.focus();

                if (usuarioEnProceso.pin === null) {
                    msg.innerText = `👋 Hola ${usuarioEnProceso.nombre.split(' ')[0]}, crea tu PIN de 4 dígitos:`;
                    msg.style.color = "var(--accent-success)";
                    inputPin.style.borderColor = "var(--accent-success)";
                    btn.innerText = "GUARDAR MI PIN Y ENTRAR";
                    btn.className = "btn-success";
                } else {
                    msg.innerText = `Ingrese PIN para ${usuarioEnProceso.nombre}:`;
                    msg.style.color = "var(--text-main)";
                    inputPin.style.borderColor = "var(--border-color)";
                    btn.innerText = "INICIAR SESIÓN";
                    btn.className = "";
                }
            }
        }

        function checkEnter(e) { if (e.key === 'Enter') procesarLogin(); }

        async function procesarLogin() {
            const pin = document.getElementById('pin_input').value.trim();
            if (!pin || pin.length < 4) return alert("⚠️ Ingrese su PIN de 4 dígitos.");


            const { data, error } = await supabaseClient.rpc('verificar_login', {
                p_dni: usuarioEnProceso.dni,
                p_pin: pin
            });

            if (error || !data.success) {
                alert("⚠️ " + (data?.message || "PIN Incorrecto."));
                document.getElementById('pin_input').value = '';
                return;
            }


            sessionStorage.setItem('sgcf_sesion_cloud', JSON.stringify(data.user));
            
            if (data.user.permisos.includes('tab_admin')) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'panel.html';
            }
        }

        async function solicitarRestablecimientoPIN() {
            if (!usuarioEnProceso) return;
            const pinAdmin = prompt(`Restablecer PIN para: ${usuarioEnProceso.nombre}\n\nIngrese el PIN de Administrador para autorizar:`);
            if (pinAdmin === null) return;


            const { data, error } = await supabaseClient.rpc('restablecer_pin_usuario', {
                p_dni_objetivo: usuarioEnProceso.dni,
                p_pin_admin: pinAdmin
            });

            if (error || !data.success) {
                alert("⚠️ " + (data?.message || "PIN de Administrador incorrecto."));
                return;
            }

            usuarioEnProceso.pin = null;
            alert(`✅ PIN restablecido para ${usuarioEnProceso.nombre}. Podrá crear uno nuevo al iniciar sesión.`);
            cambiarUsuarioSeleccionado();
        }
    </script>
</body>
</html>

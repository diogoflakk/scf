<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGCF - PANEL DE CONTROL</title>
    

    <link rel="icon" type="image/png" href="logo.png">
    

    <link rel="stylesheet" href="theme.css">
    

    <script src="theme.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { padding: 10px; }
        .app-container { max-width: 1000px; margin: 0 auto; background: var(--bg-surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 20px; }
        .header { background: var(--header-bg); color: var(--text-main); padding: 20px; border-bottom: 2px solid var(--accent-main); display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--text-main); }
        .user-badge { background: var(--badge-bg); padding: 8px 15px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px;}
        .btn-logout { background: transparent; color: #FF6B6B; border: 1px solid #FF6B6B; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); font-size: 14px; text-transform: uppercase; }
        input[type="text"], input[type="tel"], select { width: 100%; padding: 14px; background: var(--input-bg); color: var(--input-text); border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 15px; font-family: inherit; }
        input:focus, select:focus { border-color: var(--accent-main); outline: none; }
        button { width: 100%; background: var(--accent-main); color: #FFF; border: none; padding: 14px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.2s;}
        button:hover { filter: brightness(1.1); }
        button.btn-danger { background: var(--accent-danger); color: white; }
        button.btn-success { background: var(--accent-success); color: #FFF; font-weight: 800; }
        button.btn-warning { background: var(--accent-gold); color: black; }
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        @media (min-width: 768px) { .input-group { flex-direction: row; } .input-group > * { flex: 1; } }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid var(--border-color); padding: 12px; text-align: left; }
        th { background-color: var(--header-bg); color: var(--text-main); font-weight: 600; }
        tr:nth-child(even) { background-color: var(--row-even); }
        .admin-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 768px) { .admin-grid { grid-template-columns: 1fr 1fr; } }
        .admin-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; }
        .admin-card.full-width { grid-column: 1 / -1; }
        .admin-card h3 { margin-top: 0; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; font-size: 16px; }
        .checkbox-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 10px; background: var(--input-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .checkbox-group label { font-size: 14px; text-transform: none; color: var(--text-main); display: flex; align-items: center; gap: 8px; cursor: pointer; margin: 0; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-main); cursor: pointer; }
        
        #print-area { display: none; }

        @media print {

            body * {
                visibility: hidden !important;
            }
            

            #print-area, #print-area * {
                visibility: visible !important;
            }


            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100mm;
            }

            @page {
                size: 100mm 100mm;
                margin: 0;
            }

            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .label-box {
                width: 100mm;
                height: 100mm;
                box-sizing: border-box;
                display: flex !important;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: white;
                page-break-after: always;
                break-after: page;
                margin: 0;
            }

            .label-barcode {
                width: 100%;
                text-align: center;
            }

            .print-barcode-svg {
                width: 90% !important;
                height: 180px !important;
            }
        }
    </style>
</head>
<body>

    <button class="theme-float-btn" onclick="alternarTema()" title="Cambiar Tema">🌓</button>

    <div class="app-container">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <img src="logo.png" alt="Logo GCF" style="height: 38px; width: auto; object-fit: contain;">
                <h1>⚙️ PANEL DE CONTROL</h1>
            </div>
            <div class="user-badge">
                👤 <span id="current_user_name">Admin</span>
                <button class="btn-logout" onclick="cerrarSesion()">SALIR</button>
            </div>
        </div>

        <div style="margin-bottom: 25px; display: flex; gap: 15px; align-items: center;">
            <a href="panel.html" style="color: var(--accent-gold); text-decoration: underline; font-weight: bold;">⬅️ Ir al Panel Operativo</a>
            <button class="btn-danger" onclick="limpiarBaseDatos()" style="width: auto; padding: 10px 20px; font-size: 13px; margin-left: auto;">🗑️ ELIMINAR DATOS</button>
        </div>


        <div class="admin-card full-width" style="margin-bottom: 25px;">
            <h3 style="color: var(--accent-gold); display: flex; align-items: center; gap: 8px;">🖨️ Centro de Impresión Múltiple</h3>
            
            <div class="form-group">
                <label>Método de Selección:</label>
                <select id="tipo_impresion_lote" onchange="cambiarMetodoImpresion()">
                    <option value="rango">📊 Generar por Rango de Series (Ej: LAA-001 al LAA-020)</option>
                    <option value="manual">☑️ Selección Múltiple de Cajas Existentes (Checkboxes)</option>
                </select>
            </div>

            <!-- Panel Rango -->
            <div id="seccion_rango" class="input-group form-group" style="background: var(--input-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
                <div>
                    <label style="font-size: 13px;">Serie Inicial:</label>
                    <input type="text" id="rango_inicio" placeholder="Ej: LAA-001">
                </div>
                <div>
                    <label style="font-size: 13px;">Serie Final:</label>
                    <input type="text" id="rango_fin" placeholder="Ej: LAA-020">
                </div>
            </div>

            <!-- Panel Selección Múltiple con Checkboxes -->
            <div id="seccion_manual" class="form-group" style="display: none; background: var(--input-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <label style="font-size: 13px; margin: 0;">Seleccione las cajas a imprimir:</label>
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="btn-warning" style="padding: 4px 10px; font-size: 11px; width: auto;" onclick="seleccionarTodasCajas(true)">Marcar Todas</button>
                        <button type="button" class="btn-danger" style="padding: 4px 10px; font-size: 11px; width: auto;" onclick="seleccionarTodasCajas(false)">Desmarcar</button>
                    </div>
                </div>
                <div id="contenedor_lista_cajas" style="max-height: 220px; overflow-y: auto; background: var(--bg-surface); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px;">
                    <span style="color: var(--text-muted); font-size: 13px;">Cargando cajas disponibles...</span>
                </div>
            </div>

            <button class="btn-success" onclick="ejecutarImpresionLote()" style="padding: 16px; font-size: 16px;">🖨️ IMPRESIÓN RÁPIDA DE ETIQUETAS EN LOTE</button>
        </div>

        <div class="admin-grid">
            <div class="admin-card">
                <h3>📍 Ubicaciones del Inventario</h3>
                <div class="form-group">
                    <label>Nueva Ubicación</label>
                    <input type="text" id="nueva_ubi_nombre" placeholder="Ej: ZONA - C3">
                </div>
                <button class="btn-success" style="margin-bottom: 15px;" onclick="agregarUbicacion()">+ Agregar Ubicación</button>
                <div id="lista_ubicaciones" style="max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div class="admin-card">
                <h3>📦 Dimensiones de Cajas</h3>
                <div class="form-group">
                    <label>Nueva Dimensión</label>
                    <input type="text" id="nueva_dim_nombre" placeholder="Ej: Mediana">
                </div>
                <button class="btn-success" style="margin-bottom: 15px;" onclick="agregarDimension()">+ Agregar Dimensión</button>
                <div id="lista_dimensiones" style="max-height: 200px; overflow-y: auto;"></div>
            </div>

            <div class="admin-card full-width">
                <h3 id="lbl_modo_usuario">👥 Gestión de Operadores, DNI y Roles</h3>
                <div class="form-group">
                    <div class="input-group" style="margin-bottom: 15px;">
                        <div><label>DNI (8 dígitos)</label><input type="tel" id="reg_dni" maxlength="8" placeholder="Ej: 40123456"></div>
                        <div><label>Nombre Completo</label><input type="text" id="reg_nombre" placeholder="Nombres y Apellidos"></div>
                        <div><label>Nombre del Rol</label><input type="text" id="reg_rol" placeholder="Ej: Supervisor"></div>
                    </div>
                    
                    <label>Permisos de Acceso Asignados:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="perm_ingreso" value="tab_ingreso"> Registrar Ingresos</label>
                        <label><input type="checkbox" id="perm_egreso" value="tab_egreso"> Procesar Retiros</label>
                        <label><input type="checkbox" id="perm_traslado" value="tab_traslado"> Traslados Internos</label>
                        <label><input type="checkbox" id="perm_inventario" value="tab_inventario" checked> Ver Inventario</label>
                        <label><input type="checkbox" id="perm_admin" value="tab_admin"> Panel de Control</label>
                    </div>

                    <div style="display: flex; gap: 15px; margin-top: 25px;">
                        <button class="btn-success" style="flex: 2;" onclick="guardarUsuarioAdmin()">💾 Guardar Operador</button>
                        <button id="btn_cancelar_edicion" class="btn-warning" style="flex: 1; display: none;" onclick="cancelarEdicionUsuario()">Cancelar</button>
                    </div>
                </div>
                
                <h4 style="margin-top: 35px; border-top: 1px solid var(--border-color); padding-top: 20px; color: var(--text-main);">Usuarios Activos:</h4>
                <div id="lista_usuarios" class="table-responsive"></div>
            </div>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        const SUPABASE_URL = "https://yopvikmrjnqcbkkubcbs.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_XQ5WAm8porUCSyP_q37sPQ_Ubxlr0Rl";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioActual = null;
        let dniEditandoOriginal = null;
        const PASSWORD_MAESTRA_ADMIN = "0801200713011409";

        window.onload = async () => {
            const sesionGuardada = sessionStorage.getItem('sgcf_sesion_cloud');
            if(sesionGuardada) {
                usuarioActual = JSON.parse(sesionGuardada);
                if (!usuarioActual.permisos.includes('tab_admin')) {
                    alert("⚠️ Acceso denegado. Se requieren privilegios de Administrador.");
                    window.location.href = 'panel.html';
                    return;
                }
                document.getElementById('current_user_name').innerText = usuarioActual.nombre;
                await cargarPanelAdmin();
                await cargarCajasParaSeleccion();
            } else {
                window.location.href = 'login.html';
            }
        };

        function cerrarSesion() {
            sessionStorage.removeItem('sgcf_sesion_cloud');
            window.location.href = 'login.html';
        }

        async function cargarPanelAdmin() {
            const { data: ubis } = await supabaseClient.from('ubicaciones').select('nombre');
